    <style>
        :root {
            --pastel-pink: #ffdde1;
            --deep-pink: #ee9ca7;
            --cream: #fffaf0;
            --text-pink: #d63384;
            --soft-rose: #ff8da1;
            --warm-gold: #ffd76a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden auto;
            background:
                radial-gradient(circle at 14% 18%, rgba(255, 248, 219, 0.9) 0 8%, transparent 9%),
                linear-gradient(135deg, var(--pastel-pink) 0%, var(--deep-pink) 100%);
        }

        .anime-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .sakura {
            position: absolute;
            background-color: #ffb7c5;
            border-radius: 100% 0 100% 0;
            opacity: 0.8;
            filter: blur(1px);
            animation: fall linear infinite;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 100px;
            opacity: 0.65;
            filter: blur(18px);
            animation: drift linear infinite;
        }

        .river {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15vh;
            background: linear-gradient(to bottom, rgba(173, 216, 230, 0.5), rgba(255, 182, 193, 0.5));
            backdrop-filter: blur(5px);
            overflow: hidden;
        }

        .ripple {
            position: absolute;
            height: 2px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.34);
            animation: flow linear infinite;
        }

        .container {
            width: min(450px, 100%);
            margin: auto;
            perspective: 1000px;
        }

        .card {
            position: relative;
            overflow: hidden;
            padding: 32px 20px 28px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.72);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 18% 8%, rgba(255, 255, 255, 0.72), transparent 22%),
                radial-gradient(circle at 86% 13%, rgba(255, 215, 106, 0.26), transparent 20%);
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .logo {
            display: inline-block;
            margin-bottom: 18px;
            font-size: 60px;
            filter: drop-shadow(0 5px 10px rgba(214, 51, 132, 0.3));
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            margin-bottom: 10px;
            color: var(--text-pink);
            font-size: clamp(23px, 6vw, 28px);
            font-weight: 900;
            letter-spacing: 0;
            line-height: 1.12;
            text-transform: uppercase;
            text-shadow: 1px 1px 0 white;
        }

        .subtitle {
            max-width: 310px;
            margin: 0 auto 22px;
            color: #885a5f;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.5;
        }

        .captcha-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 96px;
            max-width: 100%;
            margin: 20px auto;
            padding: 14px;
            overflow: hidden;
            border: 2px solid var(--pastel-pink);
            border-radius: 20px;
            background: rgba(255, 250, 240, 0.82);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.02);
        }

        .status {
            display: none;
            margin: 18px 0 0;
            padding: 14px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 800;
            line-height: 1.35;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .status.success {
            display: block;
            position: relative;
            color: var(--text-pink);
            border: 2px solid #ffc1cc;
            background: #fff0f5;
        }

        .status.success::after {
            content: "💖";
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            animation: sparkle 1s infinite alternate;
        }

        .status.error {
            display: block;
            color: #d32f2f;
            border: 2px solid #ffcdd2;
            background: #fff5f5;
        }

        .status.loading {
            display: block;
            color: #9a6b00;
            border: 2px solid #ffeaa7;
            background: #fffef0;
        }

        .footer {
            margin-top: 24px;
            color: #a8888a;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); }
            100% { transform: translateY(110vh) translateX(100px) rotate(360deg); }
        }

        @keyframes drift {
            from { left: -220px; }
            to { left: 110vw; }
        }

        @keyframes flow {
            from { transform: translateX(-100%); }
            to { transform: translateX(200%); }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes sparkle {
            from { transform: translateY(-50%) scale(1); opacity: 1; }
            to { transform: translateY(-50%) scale(1.3); opacity: 0.72; }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 1ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .card {
                padding: 28px 16px 24px;
                border-radius: 34px;
            }

                font-size: 54px;
            }

                font-size: 15px;
            }
        }

    <main class="container">
        <section class="card">
            <div class="content">

                </div>

                <div id="status" class="status loading">Loading verification...</div>

                <div id="manual" style="display:none; margin-top:14px;">
                    <button onclick="copyCode()" style="padding:12px 22px; border:none; border-radius:16px; background:#d63384; color:#fff; font-size:16px; font-weight:800; cursor:pointer;">📋 Copy verify code</button>

    <script>
        const CONFIGURED_TURNSTILE_SITE_KEY = "0x4AAAAAADDxr03AHxX7zupM";
        const URL_SITE_KEY = new URLSearchParams(window.location.search).get("site_key") || "";
        const TURNSTILE_SITE_KEY = URL_SITE_KEY || (
            CONFIGURED_TURNSTILE_SITE_KEY.startsWith("__") ? "" : CONFIGURED_TURNSTILE_SITE_KEY
        );

        let tg = null;
        let turnstileWidgetId = null;
        let isVerified = false;
        let isSending = false;

        function showStatus(message, type) {
            const statusEl = document.getElementById("status");
            statusEl.textContent = message;
            statusEl.className = "status " + (type || "loading");
        }

        function setupTelegram() {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                return true;
            }
            tg = null;
            return true;
        }

        function initTurnstile() {
            if (turnstileWidgetId !== null || typeof turnstile === "undefined") {
                return;
            }
            if (!TURNSTILE_SITE_KEY) {
                showStatus("Verification is not configured yet.", "error");
                return;
            }

            try {
                turnstileWidgetId = turnstile.render("#cf-turnstile", {
                    sitekey: TURNSTILE_SITE_KEY,
                    action: "anyy_web_verify",
                    callback: onCaptchaSuccess,
                    "expired-callback": function() {
                        isVerified = false;
                        showStatus("Oopsie! CAPTCHA expired. Try once more, cutie! 🌸", "error");
                    },
                    "error-callback": function() {
                        showStatus("Oh no! CAPTCHA error. Please refresh the page! 🎀", "error");
                    }
                });
            } catch (error) {
                console.error("Turnstile render failed:", error);
                showStatus("CAPTCHA failed to load. Please refresh the page, sweetie! 🍬", "error");
            }
        }

        function waitForTurnstile() {
            initTurnstile();
            const interval = window.setInterval(function() {
                initTurnstile();
                if (turnstileWidgetId !== null) {
                    window.clearInterval(interval);
                }
            }, 150);

            window.setTimeout(function() {
                window.clearInterval(interval);
                if (turnstileWidgetId === null) {
                    showStatus("CAPTCHA is taking too long to load. Please refresh.", "error");
                }
            }, 10000);
        }

        function initAnimeBG() {
            const sakuraContainer = document.getElementById("sakura-container");
            const cloudsContainer = document.getElementById("clouds-container");
            const river = document.getElementById("river");

            for (let i = 0; i < 30; i++) {
                const petal = document.createElement("div");
                const size = Math.random() * 10 + 5 + "px";
                petal.className = "sakura";
                petal.style.width = size;
                petal.style.height = size;
                petal.style.left = Math.random() * 100 + "vw";
                petal.style.animationDuration = Math.random() * 5 + 5 + "s";
                petal.style.animationDelay = Math.random() * 5 + "s";
                petal.style.opacity = Math.random() * 0.5 + 0.3;
                sakuraContainer.appendChild(petal);
            }

            for (let i = 0; i < 5; i++) {
                const cloud = document.createElement("div");
                cloud.className = "cloud";
                cloud.style.width = Math.random() * 150 + 100 + "px";
                cloud.style.height = Math.random() * 50 + 40 + "px";
                cloud.style.top = Math.random() * 40 + "vh";
                cloud.style.animationDuration = Math.random() * 20 + 20 + "s";
                cloud.style.animationDelay = Math.random() * 20 + "s";
                cloudsContainer.appendChild(cloud);
            }

            for (let i = 0; i < 10; i++) {
                const ripple = document.createElement("div");
                ripple.className = "ripple";
                ripple.style.width = Math.random() * 100 + 50 + "px";
                ripple.style.top = Math.random() * 100 + "%";
                ripple.style.left = "0";
                ripple.style.animationDuration = Math.random() * 3 + 2 + "s";
                ripple.style.animationDelay = Math.random() * 3 + "s";
                river.appendChild(ripple);
            }
        }

        function onCaptchaSuccess(token) {
            isVerified = true;
            window.cfToken = token;
            showStatus("Verified! You are a real cutie human ✨", "success");
            window.setTimeout(sendVerification, 450);
        }

        function sendVerification() {
            if (isSending) {
                return;
            }
            if (!isVerified || !window.cfToken) {
                showStatus("Please complete the CAPTCHA first.", "error");
                return;
            }
            showManual();
            if (!tg) {
                showStatus("✅ CAPTCHA passed! Send the code below to the bot 👇", "success");
                return;
            }

            isSending = true;
            showStatus("Sending to bot... 🚀 (if no reply in 10s, use the code below 👇)", "loading");

            try {
                tg.sendData(JSON.stringify({
                    action: "verify",
                    cf_token: window.cfToken,
                    timestamp: Date.now()
                }));
                showStatus("✅ Sent! If the bot doesn't reply in 10s, use the code below 👇", "success");
            } catch (error) {
                console.error("Telegram sendData failed:", error);
                isSending = false;
                showStatus("Auto-send failed. Send the code below manually 👇", "error");
            }
        }

        function manualCode() {
            return "VERIFY:" + (window.cfToken || "");
        }

        function showManual() {
            var box = document.getElementById("manual");
            if (box) {
                box.style.display = "block";
            }
        }

        function copyCode() {
            var code = manualCode();
            function done() {
                showStatus("📋 Code copied! Paste it in the bot chat.", "success");
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).then(done, function() { fallbackCopy(code); done(); });
            } else {
                fallbackCopy(code);
                done();
            }
        }

        function fallbackCopy(text) {
            var ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand("copy"); } catch (e) {}
            document.body.removeChild(ta);
        }

        document.addEventListener("DOMContentLoaded", function() {
            initAnimeBG();
            if (!setupTelegram()) {
                return;
            }
            waitForTurnstile();
        });

        document.addEventListener("visibilitychange", function() {
            if (!document.hidden) {
                initTurnstile();
            }
        });
    </script>
